# ============================================================
# 🔄 CI — Build + pruebas + despliegue en GitHub Pages
#
# Se ejecuta en cada push y pull request a main:
#   1. Instala con pnpm (lockfile congelado)
#   2. Compila el build de producción
#   3. Ejecuta las 51 pruebas end-to-end con Chromium
#   4. (solo push a main) Publica dist/ en GitHub Pages
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Instalar pnpm
        # Sin «version»: pnpm lee la versión de «packageManager» en package.json
        uses: pnpm/action-setup@v4

      - name: 🟢 Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 📚 Dependencias
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build de producción
        run: pnpm build

      - name: 🌐 Instalar Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      - name: 🧪 Pruebas end-to-end
        run: pnpm test:e2e

      - name: 📸 Subir capturas si falla algo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-fallo
          path: docs/screenshot-*.png
          if-no-files-found: ignore

      # --- Despliegue en GitHub Pages (solo push a main) ---
      - name: ⚙️ Configurar Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: 📤 Subir artefacto de Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: 🌍 Publicar en GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
